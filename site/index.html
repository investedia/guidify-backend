<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guidify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, precise; a company that empowers entrepreneurs with digital solutions
   IDEA: thousands of tiny Guidify marks that together draw one giant Guidify mark, waking softly under the cursor
   PICTURE: dense canvas field, the big G sampled from the real logo, subtle hover light
   COLOUR and TYPE: monochrome only; Geist 500, tight tracking, grey second line
   LAYOUT: thin nav (Products, About, Contact); four hero layouts to choose from; logo studies below */
:root{--bg:#08090a;--ink:#f7f8f8;--mute:#8a8f98;--line:rgba(255,255,255,.09);--card:#0f1012;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background .5s,color .5s}
button:focus-visible,a:focus-visible{outline:2px solid var(--mute);outline-offset:2px}
.hero{position:relative;height:100vh;min-height:620px;display:flex;flex-direction:column;overflow:hidden}
#f{position:absolute;inset:0;width:100%;height:100%}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1280px;margin:0 auto;padding:20px 32px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:17px;letter-spacing:-.01em}
.m{background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand .m{width:24px;height:24px}
nav{display:flex;gap:4px}
nav a{color:var(--mute);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:8px;transition:color .2s}
nav a:hover{color:var(--ink)}
.cta{font-size:14px;font-weight:500;color:var(--bg);background:var(--ink);text-decoration:none;padding:8px 14px;border-radius:8px}
.copy{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:1280px;margin:0 auto;padding:0 32px 96px;pointer-events:none}
.copy a{pointer-events:auto}
h1{margin:0;font-weight:500;font-size:clamp(40px,5.6vw,76px);line-height:1.02;letter-spacing:-.045em;max-width:12.5ch;text-wrap:balance}
h1 span{color:var(--mute)}
.sub{margin:24px 0 36px;font-size:clamp(16px,1.5vw,18px);color:var(--mute);max-width:30em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-size:15px;font-weight:500;text-decoration:none;padding:12px 20px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center;transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.p{background:var(--ink);color:var(--bg)}
.s{color:var(--ink);border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
@media(max-width:600px){.copy{justify-content:flex-end;padding-bottom:56px}nav a{padding:8px}.brand span{display:none}header,.copy{padding-inline:18px}}
@media(prefers-reduced-motion:reduce){.btn,body{transition:none}}
</style></head>

function build(){if(!big.complete)return;const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
